<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Drawing & Eraser Gesture Canvas</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #07090e;
      --card: #0f172a;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 0.5rem; text-align: center; }
    .status { margin-bottom: 1rem; color: #94a3b8; font-size: 0.9rem; text-align: center; }
    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 480px;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #000;
    }
    video { display: none; }
    canvas { width: 100%; height: 100%; transform: scaleX(-1); }
    .controls-row { display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem; }
    .gesture-box { background: var(--card); padding: 0.75rem 1.25rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; }
    .highlight { color: #4ade80; font-weight: bold; }
    .clear-btn { background: #ef4444; color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: monospace; }
    .clear-btn:hover { background: #dc2626; }
    .nav-link { margin-top: 1.5rem; color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Computer Vision: Air Drawing & Eraser</h1>
  <div class="status"><b>Pinch fingers</b> to draw lines. <b>Open hand</b> to use the red eraser!</div>

  <div class="viewport-container">
    <video id="webcam"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>
