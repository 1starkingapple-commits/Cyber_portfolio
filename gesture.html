<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Hand Gesture Reaction Canvas</title>
  
  <!-- MediaPipe & Camera Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #07090e;
      --card: #0f172a;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { color: var(--accent); font-size: 1.6rem; margin-bottom: 0.5rem; text-align: center; }
    .status { margin-bottom: 1.5rem; color: #94a3b8; font-size: 0.9rem; text-align: center; }
    
    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 480px;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background: #000;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror view */
    }
    
    .gesture-box {
      margin-top: 1.5rem;
      background: var(--card);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    .highlight { color: #4ade80; font-weight: bold; }
    .nav-link {
      margin-top: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Computer Vision: Hand Gesture Reaction Lab</h1>
  <div class="status">Allow camera access and point your hand at the screen to trigger real-time canvas effects.</div>

  <div class="viewport-container">
    <video id="webcam"></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div class="gesture-box">
    State: <span id="gesture-text" class="highlight">Initializing camera...</span>
  </div>

  <a href="index.html" class="nav-link">&larr; Back to Portfolio Homepage</a>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const gestureText = document.getElementById('gesture-text');

    let particles = [];

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    camera.start();

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        const ix = indexTip.x * canvasElement.width;
        const iy = indexTip.y * canvasElement.height;
        const tx = thumbTip.x * canvasElement.width;
        const ty = thumbTip.y * canvasElement.height;

        const distance = Math.hypot(ix - tx, iy - ty);

        if (distance < 35) {
          gestureText.innerText = "PINCH DETECTED (Particle Burst!)";
          createParticles(ix, iy);
        } else {
          gestureText.innerText = "Tracking Index Fingertip";
          drawGlowingPoint(canvasCtx, ix, iy);
        }

        drawHandSkeleton(canvasCtx, landmarks);
      } else {
        gestureText.innerText = "Waiting for hand...";
      }

      updateParticles(canvasCtx);
      canvasCtx.restore();
    }

    function drawGlowingPoint(ctx, x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, 2 * Math.PI);
      ctx.fillStyle = "#38bdf8";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 15;
      ctx.fill();
    }

    function createParticles(x, y) {
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 4 + 2,
          alpha: 1,
          color: `hsl(${Math.random() * 60 + 120}, 100%, 60%)`
        });
      }
    }

    function updateParticles(ctx) {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      }
    }

    function drawHandSkeleton(ctx, landmarks) {
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 2;
      landmarks.forEach((pt) => {
        ctx.beginPath();
        ctx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 3, 0, 2 * Math.PI);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
      });
    }
  </script>
</body>
</html>
